{% extends "base.html" %}
{% block title %}Log in — Voice Patch{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Log in</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Username
      <input type="text" name="username" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Log in</button>
  </form>
  <p class="muted small">
    Local/dev default: <code>admin</code> / <code>admin</code> — you will be
    required to change it immediately after first login.
  </p>
</div>
{% endblock %}
